version: '3'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  setup:
    desc: Install project dependencies from the lockfile
    cmds:
      - npm ci

  dev:
    desc: Start the local development server
    cmds:
      - npm run dev

  lint:
    desc: Run the website lints
    cmds:
      - npm run lint
