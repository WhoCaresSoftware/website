<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Selected work — file drawer concept</title>
<style>
:root {
  --bg: #0C0F10; --surface: #1C2324; --surface-2: #141A1B; --fg: #E8ECEB; --muted: #9FAAA8; --rule: #2A3335;
  --accent: #6CC2B8; --spring: cubic-bezier(.2,1.25,.3,1); --ease: cubic-bezier(.16,1,.3,1);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.55 "Source Sans 3", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
.page { max-width: 1120px; margin: 0 auto; padding: 56px 32px 96px; }
.head { display: flex; justify-content: space-between; align-items: end; gap: 24px; flex-wrap: wrap; }
.head h2 { margin: 0; font-size: 44px; font-weight: 600; letter-spacing: -.02em; line-height: 1.05; }
.head p { margin: 8px 0 0; color: var(--muted); max-width: 46ch; }
.hint { display: flex; gap: 8px; color: var(--muted); font-size: 14px; }
.hint kbd { padding: 2px 8px; border: 1px solid var(--rule); border-radius: 6px; font: inherit; font-size: 13px; }

/* The drawer: folders stand front to back, each lower one in front. */
.drawer { --n: 5; position: relative; height: 640px; margin-top: 32px; perspective: 1600px; perspective-origin: 50% -30%; }
.drawer::after { content: ''; position: absolute; left: -2%; right: -2%; bottom: -14px; height: 70px; border-radius: 0 0 22px 22px; background: linear-gradient(var(--surface-2), var(--bg)); border: 1px solid var(--rule); border-top: 0; z-index: 20; }
.folder { --lift: 0px; position: absolute; left: 0; right: 0; bottom: calc(var(--i) * 64px + 20px); height: 300px; transform-origin: 50% 100%; perspective: 1400px; perspective-origin: 50% 0; transform: translateY(var(--lift)) scale(calc(1 - var(--i) * .03)); transition: transform .7s var(--spring), filter .5s, opacity .5s; z-index: calc(var(--n) - var(--i)); cursor: pointer; }
.folder .back { position: absolute; inset: 0; border-radius: 4px 14px 14px 14px; background: linear-gradient(var(--c-soft), var(--surface-2) 55%); border: 1px solid var(--rule); }
.folder .tab { position: absolute; top: -34px; left: calc(2% + var(--i) * 19.2%); width: 18%; height: 35px; display: flex; align-items: center; gap: 8px; padding: 0 14px; border: 1px solid var(--rule); border-bottom: 0; border-radius: 12px 12px 0 0; background: var(--c-soft); font-size: 14px; white-space: nowrap; overflow: hidden; }
.folder .tab b { color: var(--c); font-variant-numeric: tabular-nums; }
.folder .tab span { overflow: hidden; text-overflow: ellipsis; color: var(--fg); }
.paper { position: absolute; left: 4%; right: 4%; top: 14px; height: 286px; border-radius: 6px; background: var(--bg); border: 1px solid var(--rule); box-shadow: 0 -8px 24px #0006; transition: transform .9s var(--spring), box-shadow .6s; transform: translateY(0); display: grid; grid-template-columns: 1.15fr 1fr; overflow: hidden; }
.paper .art { display: block; width: 100%; height: 100%; }
.paper .copy { padding: 26px 28px; display: flex; flex-direction: column; gap: 8px; }
.paper .copy .kind { color: var(--muted); font-size: 14px; letter-spacing: .1em; text-transform: uppercase; }
.paper .copy h3 { margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; }
.paper .copy p { margin: 0; color: var(--muted); font-size: 15px; }
.paper .copy .open { margin-top: auto; align-self: start; display: inline-flex; align-items: center; gap: 10px; padding: 12px 18px; border-radius: 999px; background: var(--c); color: var(--bg); font-weight: 600; border: 0; font: inherit; font-weight: 600; cursor: pointer; }
.cover { position: absolute; left: 0; right: 0; bottom: 0; height: 270px; overflow: hidden; border-radius: 6px 6px 14px 14px; background: linear-gradient(170deg, var(--c-soft), var(--surface) 40%, var(--surface-2)); border: 1px solid var(--rule); transform-origin: 50% 100%; transition: transform .8s var(--ease); box-shadow: 0 -10px 30px #0007; }
.cover .label { position: absolute; left: 28px; top: 26px; display: flex; align-items: baseline; gap: 12px; }
.cover .label b { color: var(--c); font-size: 15px; font-variant-numeric: tabular-nums; }
.cover .label strong { font-size: 22px; font-weight: 600; }
.cover .label span { color: var(--muted); font-size: 14px; }
.cover .summary { position: absolute; left: 28px; bottom: 78px; max-width: 46ch; margin: 0; color: var(--muted); font-size: 15px; }
.cover .big { position: absolute; right: 24px; bottom: 30px; font-size: 140px; line-height: 1; font-weight: 600; letter-spacing: -.06em; color: transparent; -webkit-text-stroke: 1px var(--c); opacity: .35; }
.cover .stamp { position: absolute; right: 28px; top: 22px; padding: 4px 10px; border: 1px solid var(--c); border-radius: 6px; color: var(--c); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; transform: rotate(-4deg); opacity: .8; }

/* Hover: the folder lifts and its sheet peeks out. */
.drawer:not(.is-open) .folder:hover, .drawer:not(.is-open) .folder.is-focus { --lift: -18px; }
.drawer:not(.is-open) .folder:hover .paper, .drawer:not(.is-open) .folder.is-focus .paper { transform: translateY(-96px); }
.drawer:not(.is-open):hover .folder:not(:hover) { filter: brightness(.7); }

/* Open: folders in front tip forward out of the way, the chosen sheet rises out of its folder. */
.drawer.is-open .folder.is-front { transform: translateY(170px) scale(calc(1 - var(--i) * .03)); filter: brightness(.35); opacity: .0; }
.drawer.is-open .folder.is-behind { filter: brightness(.45); }
/* The chosen folder steps forward to the front slot, then its sheet is pulled clear of the cover. */
.drawer.is-open .folder.is-open { --lift: calc(var(--i) * 64px); transform: translateY(var(--lift)); z-index: 15; cursor: default; }
.drawer.is-open .folder.is-open .paper { transform: translateY(-270px); box-shadow: 0 40px 80px #000c; transition-delay: .2s; }
.drawer.is-open .folder.is-open .cover { transform: rotateX(-18deg); transition-delay: .1s; }

.controls { display: flex; justify-content: space-between; align-items: center; margin-top: 36px; }
.dots { display: flex; gap: 6px; }
.dots button { width: 28px; height: 4px; padding: 0; border: 0; border-radius: 4px; background: var(--rule); cursor: pointer; transition: background .3s, width .4s var(--ease); }
.dots button.on { background: var(--accent); width: 44px; }
.close { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border: 1px solid var(--rule); border-radius: 999px; background: none; color: var(--fg); font: inherit; font-size: 14px; cursor: pointer; opacity: 0; pointer-events: none; transition: opacity .3s; }
.drawer.is-open ~ .controls .close { opacity: 1; pointer-events: auto; }

@media (max-width: 760px) {
  .page { padding: 32px 16px 64px; } .head h2 { font-size: 32px; }
  .drawer { height: 560px; }
  .folder { bottom: calc(var(--i) * 48px + 20px); height: 270px; }
  .drawer.is-open .folder.is-open { --lift: calc(var(--i) * 48px); }
  .cover .summary, .cover .big { display: none; }
  .folder .tab { width: 19%; padding: 0 8px; font-size: 12px; } .folder .tab span { display: none; }
  .paper { grid-template-columns: 1fr; grid-template-rows: 80px 1fr; height: 256px; }
  .paper .copy { padding: 18px; } .paper .copy h3 { font-size: 24px; }
  .cover { height: 240px; } .cover .stamp { display: none; } .cover .label { flex-direction: column; gap: 2px; }
  .paper .copy p { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .paper .copy p { -webkit-line-clamp: 2; }
  .drawer.is-open .folder.is-open .paper { transform: translateY(-252px); }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
</style>
</head>
<body>
<div class="page">
  <div class="head">
    <div><h2>Our work</h2><p>Each project has its own folder in the drawer. Hover to lift a folder, then click to pull out its sheet.</p></div>
    <div class="hint"><kbd>←</kbd><kbd>→</kbd> browse <kbd>Enter</kbd> open <kbd>Esc</kbd> back</div>
  </div>
  <div class="drawer" tabindex="0" aria-label="Project drawer"></div>
  <div class="controls"><div class="dots"></div><button class="close" type="button">← Back to the drawer</button></div>
</div>
<script>
const projects = [
  { name: 'Aigistos', kind: 'Custom worksite ERP', text: 'A purpose-built system for managing worksites in Greece, now in use by the Aigistos team. Better worksite visibility and analytics, with more efficient day-to-day management.', c: '#6CC2B8', soft: '#1D3634', icon: 'site', stamp: 'Client' },
  { name: 'Hex Mythica', kind: 'Game development', text: 'End-to-end development of a roguelite deck-building game: gameplay, backend services, multiplayer systems and infrastructure. Delivered through our WhoCaresGames work.', c: '#D3B069', soft: '#36301F', icon: 'hex', stamp: 'Games' },
  { name: 'Private LLM Gateway', kind: 'Private AI', text: 'An organization-wide gateway to private language models, with your data excluded from model training. Built for clients and used in production internally.', c: '#88A8BD', soft: '#232F37', icon: 'shield', stamp: 'Internal' },
  { name: 'Brand Image Pipelines', kind: 'Brand imagery', text: 'Custom image-generation workflows for branding teams: upload your own assets and create context-aware images, built around visual consistency and brand identity.', c: '#D48AA4', soft: '#37252C', icon: 'frame', stamp: 'Client' },
  { name: 'AI Workflows & Agents', kind: 'Engineering, legal & accounting', text: 'AI tools and engineering agents across the software development lifecycle, plus AI-assisted workflows for legal and accounting work.', c: '#8AA47F', soft: '#26301F', icon: 'nodes', stamp: 'Internal' }
];
const icons = {
  site: '<path d="m150 70 60-30 70 35v50l-60 30-70-35Z"/><path d="m150 70 70 35 60-30m-60 30v50m-40-72v50m20-40v50"/>',
  hex: '<path d="m210 30 60 35v70l-60 35-60-35V65Z"/><path d="m210 62 32 18v38l-32 18-32-18V80Z"/>',
  shield: '<path d="m210 34 62 24v42c0 40-62 70-62 70s-62-30-62-70V58Z"/><path d="m182 102 20 20 38-42"/>',
  frame: '<rect x="138" y="44" width="144" height="112" rx="6"/><circle cx="244" cy="78" r="12"/><path d="m146 146 46-50 34 36 20-18 30 32"/>',
  nodes: '<circle cx="160" cy="100" r="16"/><circle cx="260" cy="56" r="16"/><circle cx="260" cy="144" r="16"/><circle cx="210" cy="100" r="9"/><path d="M176 100h25m17-6 28-30m-28 42 28 30"/>'
};
const art = (p, id) => `<svg class="art" viewBox="0 0 420 260" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><radialGradient id="g${id}" cx="60%" cy="35%" r="70%"><stop offset="0" stop-color="${p.c}" stop-opacity=".4"/><stop offset="1" stop-color="${p.c}" stop-opacity="0"/></radialGradient><pattern id="p${id}" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#ffffff" stroke-opacity=".07"/></pattern></defs><rect width="420" height="260" fill="#141A1B"/><rect width="420" height="260" fill="url(#p${id})"/><rect width="420" height="260" fill="url(#g${id})"/><g transform="translate(0 30)" fill="none" stroke="${p.c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">${icons[p.icon]}</g></svg>`;
const nr = i => String(i + 1).padStart(2, '0');
const drawer = document.querySelector('.drawer');
const dots = document.querySelector('.dots');
drawer.style.setProperty('--n', projects.length);
drawer.innerHTML = projects.map((p, i) => `
  <article class="folder" style="--i:${i};--c:${p.c};--c-soft:${p.soft}" data-i="${i}">
    <div class="back"><div class="tab"><b>${nr(i)}</b><span>${p.name}</span></div></div>
    <div class="paper">${art(p, i)}<div class="copy"><span class="kind">${p.kind}</span><h3>${p.name}</h3><p>${p.text}</p><button class="open" type="button">Read the case study →</button></div></div>
    <div class="cover"><div class="label"><b>${nr(i)}</b><strong>${p.name}</strong><span>${p.kind}</span></div><span class="stamp">${p.stamp}</span><p class="summary">${p.text.split('. ')[0]}.</p><span class="big" aria-hidden="true">${nr(i)}</span></div>
  </article>`).join('');
dots.innerHTML = projects.map((_, i) => `<button type="button" aria-label="${projects[i].name}"></button>`).join('');
const folders = [...drawer.querySelectorAll('.folder')];
let focus = 0, opened = -1;
const update = () => {
  drawer.classList.toggle('is-open', opened !== -1);
  folders.forEach((folder, i) => {
    folder.classList.toggle('is-focus', i === focus && opened === -1);
    folder.classList.toggle('is-open', i === opened);
    folder.classList.toggle('is-front', opened !== -1 && i < opened);
    folder.classList.toggle('is-behind', opened !== -1 && i > opened);
  });
  [...dots.children].forEach((dot, i) => dot.classList.toggle('on', i === (opened === -1 ? focus : opened)));
};
const openFolder = i => { opened = i; focus = i; update(); };
const close = () => { opened = -1; update(); };
folders.forEach((folder, i) => {
  folder.addEventListener('mouseenter', () => { if (opened === -1) { focus = i; update(); } });
  folder.addEventListener('click', event => { if (event.target.closest('.open')) return; if (opened === i) return; openFolder(i); });
});
[...dots.children].forEach((dot, i) => dot.addEventListener('click', () => (opened === -1 ? (focus = i, update()) : openFolder(i))));
document.querySelector('.close').addEventListener('click', close);
drawer.addEventListener('keydown', event => {
  const move = { ArrowLeft: 1, ArrowUp: 1, ArrowRight: -1, ArrowDown: -1 }[event.key];
  if (move !== undefined) { event.preventDefault(); const next = Math.max(0, Math.min(projects.length - 1, (opened === -1 ? focus : opened) + move)); opened === -1 ? (focus = next, update()) : openFolder(next); }
  if (event.key === 'Enter') openFolder(focus);
  if (event.key === 'Escape') close();
});
update();
</script>
</body>
</html>
