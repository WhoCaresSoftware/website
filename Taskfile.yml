version: '3'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  setup:
    desc: Authenticate with GitHub in the browser and install dependencies
    cmds:
      - node scripts/setup.mjs

  dev:
    desc: Start the local development server
    cmds:
      - npm run dev

  lint:
    desc: Run the website lints
    cmds:
      - npm run lint
